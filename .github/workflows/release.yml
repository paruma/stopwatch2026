name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # v0.1.0 はこの PC で検証済みの EXE を手動で添付する。
    if: github.ref != 'refs/tags/v0.1.0'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained executable
        run: >
          dotnet publish stopwatch2026.csproj -c Release -r win-x64
          --self-contained true -o publish

      - name: Create ZIP archive
        shell: pwsh
        run: Compress-Archive -Path publish/stopwatch2026.exe -DestinationPath stopwatch2026-win-x64.zip

      - name: Create checksum
        shell: pwsh
        run: (Get-FileHash stopwatch2026-win-x64.zip -Algorithm SHA256).Hash.ToLower() + "  stopwatch2026-win-x64.zip" | Set-Content -NoNewline stopwatch2026-win-x64.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            stopwatch2026-win-x64.zip
            stopwatch2026-win-x64.zip.sha256
